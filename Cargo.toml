[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
# Internal crates.
underbite-core = { path = "crates/underbite-core" }
underbite-providers = { path = "crates/underbite-providers" }
underbite-config = { path = "crates/underbite-config" }
underbite-fetch = { path = "crates/underbite-fetch" }

# whether's crates, pinned by revision. They opt into features explicitly, so each
# consumer here names the features it needs.
whether-core = { git = "https://github.com/SeasonalPugForecast/whether.git", rev = "61e6ef7e1c7e906e1623414ee736a0e89b22d9cb", default-features = false }
whether-providers = { git = "https://github.com/SeasonalPugForecast/whether.git", rev = "61e6ef7e1c7e906e1623414ee736a0e89b22d9cb", default-features = false }

# External crates: the versions whether pins, with std enabled.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "1.1.6"
schemars = { version = "1.2.2", features = ["derive"] }
jiff = "0.2.37"
ureq = "3.4.2"
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
anyhow = "1.0.104"
quick-xml = "0.42.0"
csv = "1.4.0"
# Reading zip archives (KMZ) only: deflate through zlib-rs, no writers or other codecs.
zip = { version = "9.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
png = "0.18.1"
# Tiled, uncompressed float32 GeoTIFF from NCEI; no codecs needed.
tiff = { version = "0.11.3", default-features = false }

# The iOS bridge, at whether's versions so the git dependency unifies.
uniffi = "0.32.2"
async-trait = "0.1.92"

# Tests.
tempfile = "3.27.0"
insta = { version = "1.49.0", features = ["yaml"] }
pollster = "1.0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

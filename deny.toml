# cargo-deny policy (`cargo deny check`). Permissive licenses only; no GPL.

[advisories]
version = 2

[licenses]
version = 2
# The same allow-list as whether, whose crates this workspace depends on; not every
# license on it is in use here.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    # Slint is tri-licensed; its Royalty-free option is compatible with MIT.
    "LicenseRef-Slint-Royalty-free-2.0",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# whether, on GitHub, pinned by revision.
allow-git = ["https://github.com/SeasonalPugForecast/whether.git"]
required-git-spec = "rev"

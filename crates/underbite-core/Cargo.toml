[package]
name = "underbite-core"
description = "Underbite's model, astronomy, derivations and view layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Sample snapshots for other crates' tests.
testdata = ["whether-core/testdata"]

[dependencies]
whether-core = { workspace = true, features = ["serde", "schema"] }
serde.workspace = true
schemars.workspace = true
thiserror.workspace = true
jiff = { workspace = true, features = ["tzdb-bundle-always"] }
png.workspace = true
quick-xml.workspace = true
csv.workspace = true
zip.workspace = true

[dev-dependencies]
whether-core = { workspace = true, features = ["serde", "schema", "testdata"] }
serde_json.workspace = true
insta = { workspace = true, features = ["yaml", "json"] }

[lints]
workspace = true

# Recorded responses for the Croton River scenario (USGS 01375000 and the lower Hudson). Each
# route answers the first request whose URL contains `match`; `file` is relative to this file.
# A request with no route fails with its redacted URL.

# USGS water data: the specific collections first, the site lookup last.
[[route]]
match = "collections/latest-continuous"
file = "../../raw/usgs/usgs-latest-continuous-croton-01375000.json"

# The dam gauge's discharge series (00060) and its gage height series (00065).
[[route]]
match = "collections/continuous/items?f=json&time_series_id=e32aab5ccc774c11b172102b97abc0d8"
file = "../../raw/usgs/usgs-continuous-croton-01375000-00060-2026-11-01_2026-11-08.json"

[[route]]
match = "collections/continuous/items?f=json&time_series_id=1d9a520f9f5d468099e5726040bfe317"
file = "../../raw/usgs/usgs-continuous-croton-01375000-00065-2026-11-01_2026-11-08.json"

[[route]]
match = "collections/daily/items"
file = "../../raw/usgs/usgs-daily-croton-01375000-00060-mean-2025-11-08_2026-11-07.json"

[[route]]
match = "observationNormals"
file = "../../raw/usgs/usgs-statistics-normals-croton-01375000-00060-doy-percentile-11-05_11-10.json"

[[route]]
match = "site_type_code=ST"
file = "../../raw/usgs/usgs-monitoring-locations-bbox-croton-st.json"

[[route]]
match = "site_type_code=ES"
file = "../../raw/usgs/usgs-monitoring-locations-bbox-croton-es.json"

[[route]]
match = "site_type_code=LK"
file = "../../raw/usgs/usgs-monitoring-locations-bbox-croton-lk.json"

[[route]]
match = "collections/time-series-metadata"
file = "../../raw/usgs/usgs-time-series-metadata-bbox-croton.json"

[[route]]
match = "USGS-01375000"
file = "../../raw/usgs/usgs-monitoring-locations-croton-01375000.json"

# CO-OPS and NDBC station lists: the same national lists wherever the spot is.
[[route]]
match = "stations.json?type=tidepredictions"
file = "../../raw/coops/coops-mdapi-stations-tidepredictions-newyork-trimmed.json"

[[route]]
match = "stations.json?type=waterlevels"
file = "../../raw/coops/coops-mdapi-stations-waterlevels-newyork-trimmed.json"

[[route]]
match = "stations.json?type=currentpredictions"
file = "../../raw/coops/coops-mdapi-stations-currentpredictions-newyork-trimmed.json"

[[route]]
match = "realtime2/HBMN6.txt"
file = "../../raw/ndbc/ndbc-HBMN6.txt-404.html"
status = 404

[[route]]
match = "ndbc.noaa.gov/activestations.xml"
file = "../../raw/ndbc/ndbc-activestations.xml"


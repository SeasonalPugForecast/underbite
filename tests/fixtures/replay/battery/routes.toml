# Recorded responses for the New York Harbor scenario (The Battery, CO-OPS 8518750, NDBC 44025
# and BATN6). Each route answers the first request whose URL contains `match`; `file` is
# relative to this file. A request with no route fails with its redacted URL.

# CO-OPS data: the max/slack and high/low routes come before the 6-minute curves, which share
# their product names. The current routes name their station and bin, so no other current
# station is answered with the Hudson River Entrance's predictions.
[[route]]
match = "station=NYH1927&time_zone=gmt&units=metric&interval=max_slack&format=json&bin=13"
file = "../../raw/coops/coops-NYH1927-bin13-max-slack-2026-11-08.json"

[[route]]
match = "interval=hilo&format=json"
file = "../../raw/coops/coops-8518750-hilo-2026-11-08.json"

[[route]]
match = "product=predictions"
file = "../../raw/coops/coops-8518750-predictions-6min-2026-11-08.json"

[[route]]
match = "product=water_level"
file = "../../raw/coops/coops-8518750-water-level-2026-11-07.json"

[[route]]
match = "product=water_temperature"
file = "../../raw/coops/coops-8518750-water-temperature-2026-11-07.json"

[[route]]
match = "product=air_temperature"
file = "../../raw/coops/coops-8518750-air-temperature-2026-11-07.json"

[[route]]
match = "product=air_pressure"
file = "../../raw/coops/coops-8518750-air-pressure-2026-11-07.json"

[[route]]
match = "product=wind"
file = "../../raw/coops/coops-8518750-wind-2026-11-07-error-nodata.json"

[[route]]
match = "station=NYH1927&time_zone=gmt&units=metric&interval=6&format=json&bin=13"
file = "../../raw/coops/coops-NYH1927-bin13-currents-predictions-6min-2026-11-08.json"

